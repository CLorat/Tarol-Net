name: Release

# docs/architecture/release.md §2. A tag v<x.y.z>[-pre] publishes (pushed, or created by tag.yml, which dispatches this
# workflow on the tag); every other trigger is a dry run that stops before `publish`.
# The owner creates the tags (git push, or the Tag workflow). Packages go to the owner's GitHub Packages feed, never to nuget.org (RL-9).
on:
  push:
    tags: ["v*"]
  workflow_dispatch: # on a branch a dry run, on a tag a release (tag.yml); the file must be on the default branch
  pull_request: # a dry run when the release files change
    paths:
      - .github/workflows/release.yml
      - .github/workflows/ci.yml
      - eng/release.py
      - eng/public-api.py
      - eng/verify-packages.sh
      - eng/tests/**

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never cancel a half-done release

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  ci:
    # The whole CI on the exact commit (RL-6): build, unit tests, package check, integration, AOT smoke.
    uses: ./.github/workflows/ci.yml

  pack:
    name: pack
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no token on disk while the build runs
          fetch-depth: 0 # MinVer reads the version from the tag

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # a tag publishes only what is on main (a tag on another branch or a fork's commit is refused)
      - name: The tag is on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"; exit 1
          fi

      - name: Pack and verify the packages
        run: eng/verify-packages.sh

      - name: Version
        id: version
        run: |
          version=$(basename "$(ls artifacts/package/release/Tarol.Kernel.*.nupkg)" .nupkg | sed 's/^Tarol\.Kernel\.//')
          if [[ "$GITHUB_REF" == refs/tags/v* && "$version" != "${GITHUB_REF_NAME#v}" ]]; then
            echo "::error::MinVer made $version, the tag is $GITHUB_REF_NAME"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          [[ "$version" == *-* ]] && echo "prerelease=true" >> "$GITHUB_OUTPUT" || echo "prerelease=false" >> "$GITHUB_OUTPUT"
          echo "Tarol $version"

      # values reach the scripts through env, not spliced into the script text
      - name: Check that the release ships its API, diagnostics and CHANGELOG section
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DRY_RUN: ${{ startsWith(github.ref, 'refs/tags/v') && ' ' || '--dry-run' }} # ' ': an empty string is falsy here
        run: python3 eng/release.py check "$VERSION" $DRY_RUN

      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DRY_RUN: ${{ startsWith(github.ref, 'refs/tags/v') && ' ' || '--dry-run' }} # ' ': an empty string is falsy here
        run: |
          python3 eng/release.py notes "$VERSION" $DRY_RUN > artifacts/release-notes.md
          cat artifacts/release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release # not "packages": the called CI uploads that name in the same run
          path: |
            artifacts/package/release/*.nupkg
            artifacts/release-notes.md
          retention-days: 30

  publish:
    name: publish
    needs: pack
    # a pushed tag, or tag.yml's dispatch on the tag it created (a tag pushed with GITHUB_TOKEN starts no push run)
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release # the owner can require a reviewer here (Settings → Environments)
    permissions:
      contents: write # the GitHub release
      packages: write # the GitHub Packages feed (GITHUB_TOKEN only, D-11)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      # global.json only: the same SDK as every other job
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: global.json
          sparse-checkout-cone-mode: false
          path: sdk

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: sdk/global.json

      # The bytes `pack` verified; --skip-duplicate makes a re-run after a failed later step safe.
      - name: Push to GitHub Packages
        env:
          NUGET_API_KEY: ${{ secrets.GITHUB_TOKEN }}
          FEED: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        run: dotnet nuget push "release/package/release/*.nupkg" --source "$FEED" --api-key "$NUGET_API_KEY" --skip-duplicate

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.pack.outputs.version }}
          PRERELEASE: ${{ needs.pack.outputs.prerelease == 'true' && '--prerelease' || '' }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag
          --title "Tarol $VERSION"
          --notes-file release/release-notes.md
          $PRERELEASE
