name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # MinVer reads the version from tags

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: .nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Tarol.slnx

      # dotnet format loads the solution without building it. Projects that compile only with generated members
      # (Tarol.Validations' value objects and IValidatable inputs) need the generator assemblies on disk first;
      # format loads the Debug configuration.
      - name: Build generators
        run: for project in src/*/*.Generators/*.csproj; do dotnet build "$project" --no-restore --nologo -v quiet; done

      - name: Format
        run: dotnet format Tarol.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Tarol.slnx -c Release --no-restore

      # Integration tests (Category=Integration, Docker) run in the integration job; exit code 8 = a project with no test left.
      - name: Unit tests
        run: >-
          dotnet test --solution Tarol.slnx -c Release --no-build
          --report-trx --coverage --coverage-output-format cobertura
          --results-directory artifacts/test-results
          -- --filter-not-trait "Category=Integration" --ignore-exit-code 8

      - name: Pack and verify packages
        run: eng/verify-packages.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results/
          retention-days: 14

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/package/release/
          retention-days: 14

  integration:
    name: integration
    runs-on: ubuntu-latest   # Docker is available on the hosted runner; Testcontainers starts postgres:17 (D-15)
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: .nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Integration tests (PostgreSQL via Testcontainers)
        run: >-
          dotnet test --project tests/Persistence/Tarol.Persistence.Npgsql.IntegrationTests -c Release
          --report-trx --results-directory artifacts/test-results

      - name: Integration tests of the reaction worker (PostgreSQL via Testcontainers)
        run: >-
          dotnet test --project tests/Sagas/Tarol.Sagas.IntegrationTests -c Release
          --report-trx --results-directory artifacts/test-results

      - name: Integration tests of the HTTP entries (PostgreSQL via Testcontainers)
        run: >-
          dotnet test --project tests/Changes/Tarol.Changes.AspNetCore.IntegrationTests -c Release
          --report-trx --results-directory artifacts/test-results

      - name: Integration tests of the PostgreSQL message bus (PostgreSQL via Testcontainers)
        run: >-
          dotnet test --project tests/Messaging/Tarol.Messaging.Npgsql.IntegrationTests -c Release
          --report-trx --results-directory artifacts/test-results

      - name: Integration tests of the NATS JetStream transport (nats:2.11 via Testcontainers)
        run: >-
          dotnet test --project tests/Messaging/Tarol.Messaging.Nats.IntegrationTests -c Release
          --report-trx --results-directory artifacts/test-results

      - name: Integration tests of the RabbitMQ transport (rabbitmq:4-management via Testcontainers)
        run: >-
          dotnet test --project tests/Messaging/Tarol.Messaging.RabbitMq.IntegrationTests -c Release
          --report-trx --results-directory artifacts/test-results

      - name: Integration tests against Zitadel (Testcontainers, ghcr.io/zitadel/zitadel)
        run: >-
          dotnet test --project tests/Security/Tarol.Security.Zitadel.IntegrationTests -c Release
          --report-trx --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: artifacts/test-results/
          retention-days: 14

  aot-smoke:
    name: aot-smoke
    runs-on: ubuntu-latest
    # The Npgsql smoke app runs its database checks natively against this service (TAROL_PG).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      TAROL_PG: Host=localhost;Port=5432;Username=postgres;Password=smoke
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: .nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Publish with Native AOT (0 IL warnings) and run
        run: eng/aot-smoke.sh linux-x64
