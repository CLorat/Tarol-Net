name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # MinVer reads the version from tags

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: .nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Tarol.slnx

      # dotnet format loads the solution without building it. Projects that compile only with generated members
      # (Tarol.Validations' value objects and IValidatable inputs) need the generator assemblies on disk first;
      # format loads the Debug configuration.
      - name: Build generators
        run: for project in src/*/*.Generators/*.csproj; do dotnet build "$project" --no-restore --nologo -v quiet; done

      - name: Format
        run: dotnet format Tarol.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Tarol.slnx -c Release --no-restore

      - name: Unit tests
        run: >-
          dotnet test --solution Tarol.slnx -c Release --no-build
          --report-trx --coverage --coverage-output-format cobertura
          --results-directory artifacts/test-results

      - name: Pack and verify packages
        run: eng/verify-packages.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results/
          retention-days: 14

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/package/release/
          retention-days: 14

  aot-smoke:
    name: aot-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: .nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Publish with Native AOT (0 IL warnings) and run
        run: eng/aot-smoke.sh linux-x64
