name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:
  # the release workflow runs the whole CI on the tagged commit first (docs/migration/release.md RL-6)
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when the release calls this file, so its run never cancels the PR's own CI
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # MinVer reads the version from tags

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Tarol.slnx

      # dotnet format loads the solution without building it. Projects that compile only with generated members
      # (Tarol.Validations' value objects and IValidatable inputs) need the generator assemblies on disk first;
      # format loads the Debug configuration.
      - name: Build generators
        run: for project in src/*/*.Generators/*.csproj; do dotnet build "$project" --no-restore --nologo -v quiet; done

      - name: Format
        run: dotnet format Tarol.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Tarol.slnx -c Release --no-restore

      # Integration tests (Category=Integration, Docker) run in the integration job; exit code 8 = a project with no test left.
      - name: Unit tests
        run: >-
          dotnet test --solution Tarol.slnx -c Release --no-build
          --report-trx --coverage --coverage-output-format cobertura
          --results-directory artifacts/test-results
          -- --filter-not-trait "Category=Integration" --ignore-exit-code 8

      - name: Tests of the release scripts
        run: python3 -m unittest discover -s eng/tests -v

      - name: Pack and verify packages
        run: eng/verify-packages.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: artifacts/test-results/
          retention-days: 14

      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages
          path: artifacts/package/release/
          retention-days: 14

  integration:
    name: integration
    runs-on: ubuntu-latest   # Docker is available on the hosted runner; Testcontainers starts postgres:17 (D-15)
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # every tests/*/*.IntegrationTests project, so a new one cannot be left out (the hand-written list missed
      # DataProtection and Operations); each project runs even when an earlier one failed
      - name: Integration tests (PostgreSQL, NATS, RabbitMQ, Zitadel via Testcontainers)
        run: |
          failed=0
          for project in tests/*/*.IntegrationTests; do
            echo "::group::$project"
            dotnet test --project "$project" -c Release --report-trx --results-directory artifacts/test-results \
              || { failed=1; echo "::error::$project failed"; }
            echo "::endgroup::"
          done
          exit $failed

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-test-results
          path: artifacts/test-results/
          retention-days: 14

  aot-smoke:
    name: aot-smoke
    runs-on: ubuntu-latest
    # The Npgsql smoke apps run their database checks natively against this service (TAROL_PG), the broker smoke apps
    # their round trips against RabbitMQ (a service) and NATS (started below: JetStream needs the -js argument).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
      rabbitmq:
        image: rabbitmq:4-management
        env:
          RABBITMQ_DEFAULT_USER: smoke          # guest may connect from loopback only
          RABBITMQ_DEFAULT_PASS: smoke
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s --health-timeout 10s --health-retries 30
    env:
      TAROL_PG: Host=localhost;Port=5432;Username=postgres;Password=smoke
      TAROL_NATS: nats://localhost:4222
      TAROL_RABBITMQ: amqp://smoke:smoke@localhost:5672/
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Start NATS with JetStream
        run: docker run -d --name nats -p 4222:4222 nats:2.11 -js

      - name: Publish with Native AOT (0 IL warnings) and run
        run: eng/aot-smoke.sh linux-x64
